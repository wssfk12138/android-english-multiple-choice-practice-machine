name: Android Release

# Builds a verified draft; publishing requires separate APK acceptance.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "已审查的完整提交 SHA，须与所选分支提交一致"
        required: true
      tag:
        description: "Release 标签：v + version_name"
        required: true
      version_name:
        description: "versionName"
        required: true
      version_code:
        description: "versionCode，须大于线上及已分发的同包名版本"
        required: true
      release_notes:
        description: "更新说明"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: android-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TAG: ${{ inputs.tag }}
      VERSION_NAME: ${{ inputs.version_name }}
      VERSION_CODE: ${{ inputs.version_code }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      RELEASE_NOTES: ${{ inputs.release_notes }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate source and remote version history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/release_guard.py preflight
      - uses: actions/setup-node@v4
        with:
          node-version: "24.18.1"
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - name: Enable pinned pnpm
        run: |
          npm install --global corepack@0.35.0
          corepack enable
      - name: Frontend regression gate and build
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm run test:all -- --standalone
          pnpm run build
          pnpm exec cap sync android
      - uses: android-actions/setup-android@v3
      - name: Prepare Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore release signing
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          names = ('ANDROID_KEYSTORE_B64', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_PASSWORD')
          if not all(os.environ.get(n) for n in names):
              raise SystemExit('Missing signing secrets')
          root = Path('frontend/android')
          data = base64.b64decode(''.join(os.environ[names[0]].split()), validate=True)
          if not data:
              raise SystemExit('Empty keystore')
          (root / 'app/release-ci.jks').write_bytes(data)
          def escape(value):
              raw = value.encode('utf-16-be')
              return ''.join(chr(92) + 'u%04x' % int.from_bytes(raw[i:i+2], 'big')
                             for i in range(0, len(raw), 2))
          properties = '\n'.join([
              'storeFile=release-ci.jks',
              'storePassword=' + escape(os.environ[names[1]]),
              'keyAlias=english-practice-machine',
              'keyPassword=' + escape(os.environ[names[2]]), '',
          ])
          (root / 'signing.properties').write_text(properties, encoding='ascii')
          PY
      - name: Native tests and signed release build
        working-directory: frontend/android
        run: |
          bash ./gradlew :app:testReleaseUnitTest :app:assembleRelease \
            "-PappVersionCode=$VERSION_CODE" "-PappVersionName=$VERSION_NAME" \
            --no-daemon --console=plain
      - name: Verify APK identity, signature and manifest
        run: |
          OUT="english-practice-machine-android-$VERSION_NAME.apk"
          cp frontend/android/app/build/outputs/apk/release/app-release.apk "$OUT"
          python3 scripts/release_guard.py apk "$OUT"
          echo "APK_PATH=$OUT" >> "$GITHUB_ENV"
      - name: Recheck remote and upload draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/release_guard.py preflight
          gh release create "$TAG" "$APK_PATH" android-update.json \
            --draft --target "$SOURCE_SHA" \
            --title "英语刷题机 Android $VERSION_NAME" --notes-file release-notes.txt
          gh release download "$TAG" --dir "$RUNNER_TEMP/release-check" \
            --pattern "$APK_PATH" --pattern android-update.json
          python3 scripts/release_guard.py downloads "$APK_PATH" "$RUNNER_TEMP/release-check"
          echo 'Draft verified. APK acceptance and explicit publishing remain required.' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove signing material
        if: always()
        run: rm -f frontend/android/app/release-ci.jks frontend/android/signing.properties
