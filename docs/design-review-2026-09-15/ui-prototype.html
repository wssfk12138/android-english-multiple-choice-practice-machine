<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>英语刷题机整改设计审阅稿</title>
<style>:root{font:15px system-ui;color:#202938;background:#eef2f7;--s:#fff;--l:#dce3ee;--m:#68758a;--b:#315efb}*{box-sizing:border-box}body{margin:0}body.dark{color:#eef3fb;background:#111822;--s:#1c2431;--l:#3b485b;--m:#aab6c8}.app{max-width:1240px;margin:auto;padding:16px}.top,.tabs,.actions,.chips,.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.top{margin-bottom:12px}.top h1{font-size:20px;margin:0 12px 0 0}.tabs button,.btn,.chip{border:1px solid var(--l);border-radius:8px;padding:8px 11px;background:var(--s);color:inherit;cursor:pointer}.tabs button.active,.btn.primary,.chip.active{background:var(--b);border-color:var(--b);color:#fff}.screen{display:none}.screen.active{display:block}.shell,.card{background:var(--s);border:1px solid var(--l);border-radius:11px;padding:16px}.head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;border-bottom:1px solid var(--l);padding-bottom:12px;margin-bottom:13px}.head h2{margin:0;font-size:20px}.muted{color:var(--m);font-size:13px}.grid{display:grid;grid-template-columns:.8fr 1.4fr;gap:12px;margin-top:12px}.list{padding:0;overflow:hidden}.word{padding:12px;border-bottom:1px solid var(--l)}.word.active{background:#eaf0ff;border-left:3px solid var(--b);padding-left:9px}.word strong{display:block}.meta{display:flex;justify-content:space-between;color:var(--m);font-size:12px;margin-top:4px}.search{min-width:200px;flex:1;border:1px solid var(--l);border-radius:8px;padding:9px;background:var(--s);color:inherit}.label{font-size:12px;font-weight:700;color:var(--b);margin:14px 0 6px}.quote{border-left:4px solid #7a8cff;background:#f5f7fb;padding:11px 13px;margin:0;line-height:1.6}.quote figcaption{color:var(--m);font-size:12px;margin-top:6px}.review{max-width:820px;margin:auto}.term{text-align:center;font-size:42px;font-weight:700;margin:12px}.phon{text-align:center;color:var(--m)}.settings{display:grid;grid-template-columns:1fr 1fr;gap:12px}.setting{display:flex;justify-content:space-between;min-height:44px;padding:9px 0;border-bottom:1px solid var(--l)}.api{display:grid;grid-template-columns:92px 1fr;gap:8px;margin:9px 0}.api input{width:100%;padding:8px;border:1px solid var(--l);border-radius:7px;background:var(--s);color:inherit}.menu{position:relative}.panel{display:none;position:absolute;right:0;top:38px;z-index:2;background:var(--s);border:1px solid var(--l);padding:6px;border-radius:8px;width:160px}.menu.open .panel{display:block}.panel button{display:block;width:100%;padding:8px;border:0;background:none;color:inherit;text-align:left}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:8px;text-align:left;border-bottom:1px solid var(--l)}@media(max-width:760px){.grid,.settings{grid-template-columns:1fr}.head{flex-direction:column}.api{grid-template-columns:1fr}.app{padding:10px}}</style>
<div class="app"><div class="top"><h1>英语刷题机 · 整改设计审阅稿</h1><button class="btn" id="theme">切换明暗</button><button class="btn" id="viewport">视口：平板横屏</button></div><div class="tabs" id="tabs"></div><main id="main"></main></div>
<script>
const pages={vocab:'单词本',review:'每日复习',display:'单词显示',settings:'设置首页',api:'模型/API',import:'导入',updates:'Android 更新',sync:'Android 同步',diagnostics:'Android 诊断',practice:'错题本/练习',assistant:'AI 助手'};const tabs=document.querySelector('#tabs'),main=document.querySelector('#main');Object.entries(pages).forEach(([id,n],i)=>{let b=document.createElement('button');b.textContent=n;b.dataset.id=id;b.className=i?'':'active';tabs.append(b)});const common='<div class="label">常用释义</div><strong>适应；改编</strong><div class="label">真题原句</div><figure class="quote">Readers often adapt their strategies when a text changes its purpose.<figcaption>合成示例 · 阅读练习</figcaption></figure>';
function render(id){let h='';if(id==='vocab')h='<div class="shell"><div class="head"><div><h2>我的单词本</h2><span class="muted">当前题库 · 216 词</span></div><button class="btn primary" data-id="review">每日一背 · 待背 24 词</button></div><div class="chips"><button class="chip active">全部 216</button><button class="chip">高频 8</button><button class="chip">每日一背 24</button><button class="chip">学习中 105</button><button class="chip">已掌握 73</button><button class="chip">等待翻译 0</button></div><div class="card"><div class="toolbar"><input class="search" placeholder="搜索单词或释义"><span class="muted">筛选：全部单词 · 216</span><button class="btn">筛选</button></div><div class="toolbar"><strong>额外巩固</strong><button class="btn" data-plan="A">5 词</button><button class="btn" data-plan="B">10 词</button><button class="btn" data-plan="C">20 词</button></div><span id="plan" class="muted">B 方案：单词 + 简短释义 + 状态，平衡扫描速度与信息量。</span></div><div class="grid"><div class="card list"><div class="word active"><strong>adapt</strong><span class="muted">适应；改编</span><div class="meta"><span>v. · 学习中</span><span>遇到 3 次</span></div></div><div class="word"><strong>clarify</strong><span class="muted">澄清；阐明</span><div class="meta"><span>v. · 学习中</span><span>遇到 2 次</span></div></div><div class="word"><strong>evidence</strong><span class="muted">证据；迹象</span><div class="meta"><span>n. · 已掌握</span><span>遇到 4 次</span></div></div></div><div class="card"><div class="head"><div><h2>adapt</h2><span class="muted">/əˈdæpt/</span></div><button class="btn">编辑</button></div>'+common+'<div class="actions"><button class="btn">▸ 例句</button><button class="btn">▸ 记忆内容</button><button class="btn">▸ 同义/相关信息</button></div></div></div></div>';else if(id==='review')h='<div class="shell review"><div class="head"><h2>每日复习 <span class="muted">01 / 20</span></h2><button class="btn">退出</button></div><div class="term">adapt</div><div class="phon">/əˈdæpt/</div>'+common+'<div class="actions" style="justify-content:center;margin-top:16px"><button class="btn">不认识</button><button class="btn">认识</button><button class="btn primary">熟练</button></div></div>';else if(id==='display')h='<div class="shell"><div class="head"><h2>单词显示</h2><span class="muted">B 方案 · 11 项独立控制</span></div><div class="settings"><div class="card">'+['单词标题','音标（标题处保留）','词性','常见释义','例句','翻译'].map(x=>'<div class="setting"><span>'+x+'</span><input type="checkbox" checked></div>').join('')+'</div><div class="card">'+['近义/相关信息','记忆内容','标签','我的卡片（语义待定）','其他词典信息'].map(x=>'<div class="setting"><span>'+x+'</span><input type="checkbox"></div>').join('')+'</div></div><p class="muted">共同释义区域不重复显示音标和词性。</p></div>';else if(id==='settings')h='<div class="shell"><div class="head"><h2>设置</h2><span class="muted">外观控制直接放在首页</span></div><div class="settings"><div class="card"><h3>外观</h3><div class="setting">夜间模式 <input type="checkbox"></div><div class="setting">紧凑间距 <input type="checkbox" checked></div><div class="setting">文字大小 <span class="muted">系统设置</span></div></div><div class="card"><h3>单词本</h3><div class="setting">历史词汇回填 <button class="btn">打开</button></div><div class="setting">单词显示 <button class="btn" data-id="display">配置</button></div></div></div></div>';else if(id==='api')h='<div class="shell"><div class="head"><h2>模型与 API</h2><div class="actions"><button class="btn primary">保存并测试</button><button class="btn">模型目录筛选</button><div class="menu"><button class="btn" id="more">⋯</button><div class="panel"><button>复制配置</button><button>设为默认</button><button>删除配置</button></div></div></div></div><div class="card"><strong>OpenAI 兼容服务 · <span style="color:#18794e">已连接</span></strong><div class="api"><label>接口地址</label><input value="https://api.example.test/v1"><label>API Key</label><input value="••••••••" type="password"><label>模型</label><input value="practice-model"></div><button class="btn">保存</button><button class="btn">测试连接</button></div><div class="card" style="margin-top:12px"><strong>模型目录</strong><button class="btn" style="float:right">搜索 / 筛选</button><p class="muted">目录默认折叠，筛选入口保持可见。</p></div><div class="card" style="margin-top:12px"><strong>Named Model Keys</strong><table class="table"><tr><th>名称</th><th>用途</th><th>状态</th></tr><tr><td>default</td><td>默认翻译与复习</td><td>可用</td></tr></table></div></div>';else h='<div class="shell"><div class="head"><h2>'+pages[id]+'</h2><button class="btn primary">'+(id==='import'?'选择文件':id==='sync'?'立即同步':id==='diagnostics'?'分享诊断日志':id==='practice'?'开始练习':'检查更新')+'</button></div><div class="card"><strong>'+({'import':'导入目标 · 草稿校对 · 智能标注范围','updates':'稳定版 / 测试版 · 版本说明与校验值','sync':'已连接 · 自动同步 · 同步类别','diagnostics':'筛选：启动 / 题库导入 / 程序更新','practice':'全部 18 · 待复习 6 · 学习中 9 · 已掌握 3','assistant':'还没有对话，从一道题或一个单词开始提问。'}[id]||'功能状态')+'</strong></div></div>';main.innerHTML='<section class="screen active">'+h+'</section>';document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.id===id))}
render('vocab');document.addEventListener('click',e=>{let b=e.target.closest('[data-id]');if(b)render(b.dataset.id);if(e.target.id==='theme')document.body.classList.toggle('dark');if(e.target.id==='more')e.target.parentElement.classList.toggle('open');let p=e.target.closest('[data-plan]');if(p)document.querySelector('#plan').textContent={A:'A 方案：紧凑列表，突出单词、状态和操作。',B:'B 方案：单词 + 简短释义 + 状态，平衡扫描速度与信息量。',C:'C 方案：单词 + 音标/释义 + 状态，信息更丰富。'}[p.dataset.plan]});document.querySelector('#viewport').onclick=()=>{let b=document.querySelector('#viewport');b.textContent=b.textContent.includes('横屏')?'视口：平板竖屏':'视口：平板横屏'};
</script>
