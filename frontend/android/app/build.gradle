apply plugin: 'com.android.application'

def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file('signing.properties')
def hasReleaseSigning = signingPropertiesFile.isFile()
if (hasReleaseSigning) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

android {
    namespace = "com.wssfk.englishpracticemachine"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.wssfk.englishpracticemachine"
        // Apache POI uses MethodHandle APIs that Android supports natively
        // from API 26. The primary target is Android 14, and Android 8.0+
        // remains a practical compatibility floor for this document-import build.
        minSdkVersion 26
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode providers.gradleProperty("appVersionCode").getOrElse("1").toInteger()
        versionName providers.gradleProperty("appVersionName").getOrElse("0.1.0-alpha")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(signingProperties.getProperty('storeFile'))
                storePassword signingProperties.getProperty('storePassword')
                keyAlias signingProperties.getProperty('keyAlias')
                keyPassword signingProperties.getProperty('keyPassword')
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def requiresReleaseSigning = graph.allTasks.any {
        it.path.endsWith('assembleRelease') ||
            it.path.endsWith('bundleRelease')
    }
    if (requiresReleaseSigning && !hasReleaseSigning) {
        throw new GradleException(
            'Fixed Android signing is not configured. Create frontend/android/signing.properties first.'
        )
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    // Native, offline text extraction for the same DOC/DOCX/PDF import flow
    // used by the Windows edition. PDFBox is only used for PDFs with a text
    // layer; image-only scans are detected and sent to manual review.
    implementation 'org.apache.poi:poi:5.2.5'
    implementation 'org.apache.poi:poi-ooxml:5.2.5'
    implementation 'org.apache.poi:poi-scratchpad:5.2.5'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
