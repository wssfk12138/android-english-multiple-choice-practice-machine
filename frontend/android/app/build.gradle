apply plugin: 'com.android.application'

def applicationIdOverride = providers.gradleProperty("appApplicationId").getOrElse("").trim()
def applicationLabelOverride = providers.gradleProperty("appApplicationLabel").getOrElse("").trim()
def applicationIconName = providers.gradleProperty("appIconName").getOrElse("ic_launcher").trim()
def signingProperties = new Properties()
def signingPropertiesFile = rootProject.file('signing.properties')
def hasReleaseSigning = signingPropertiesFile.isFile()
if (hasReleaseSigning) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

android {
    namespace = "com.wssfk.englishpracticemachine"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId applicationIdOverride ?: "com.wssfk.englishpracticemachine"
        manifestPlaceholders = [
            appLabel: applicationLabelOverride ?: "英语刷题机",
            appIcon: "@mipmap/" + applicationIconName,
            appRoundIcon: "@mipmap/" + applicationIconName + "_round"
        ]
        // Apache POI uses MethodHandle APIs that Android supports natively
        // from API 26. The primary target is Android 14, and Android 8.0+
        // remains a practical compatibility floor for this document-import build.
        minSdkVersion 26
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode providers.gradleProperty("appVersionCode").getOrElse("1").toInteger()
        versionName providers.gradleProperty("appVersionName").getOrElse("0.1.0-alpha")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        resValue 'bool', 'webview_debugging_enabled', 'false'
        // Real Android phones and tablets are arm64 today; keep the older
        // 32-bit ARM slice for compatibility. Emulator-only x86 libraries are
        // omitted because the bundled speech engine is large and there is no
        // emulator target in this build.
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
            // Sherpa opens the ONNX model through AssetManager; keep it
            // directly addressable instead of relying on compressed assets.
            noCompress 'onnx'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(signingProperties.getProperty('storeFile'))
                storePassword signingProperties.getProperty('storePassword')
                keyAlias signingProperties.getProperty('keyAlias')
                keyPassword signingProperties.getProperty('keyPassword')
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    buildTypes {
        debug {
            resValue 'bool', 'webview_debugging_enabled', 'true'
        }
        release {
            minifyEnabled false
            if (hasReleaseSigning) signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        internal {
            initWith release
            resValue 'bool', 'webview_debugging_enabled', 'true'
            matchingFallbacks = ['release']
            minifyEnabled false
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def requiresReleaseSigning = graph.allTasks.any {
        it.path.endsWith('assembleInternal') ||
            it.path.endsWith('bundleInternal') ||
            it.path.endsWith('assembleRelease') ||
            it.path.endsWith('bundleRelease')
    }
    if (requiresReleaseSigning && !hasReleaseSigning) {
        throw new GradleException(
            'Fixed Android signing is not configured. Create frontend/android/signing.properties first.'
        )
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    // Streaming JSON reader; no reflection-based deserialization of imported data.
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    testImplementation 'org.json:json:20240303'
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    // Sherpa-ONNX is not published on Maven; the verified release AAR is
    // vendored by frontend/scripts/prepare-tts-assets.ps1.
    implementation files('libs/sherpa-onnx-1.13.8.aar')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
    // Native, offline text extraction for the same DOC/DOCX/PDF import flow
    // used by the Windows edition. PDFBox is only used for PDFs with a text
    // layer; image-only scans are detected and sent to manual review.
    implementation 'org.apache.poi:poi:5.2.5'
    implementation 'org.apache.poi:poi-ooxml:5.2.5'
    implementation 'org.apache.poi:poi-scratchpad:5.2.5'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
